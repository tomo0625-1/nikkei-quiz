<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日経テスト 予想問題集</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Wordファイル(.docx)解析ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; 
            background-color: #f3f4f6; 
            color: #333; 
        }
        .option-btn { transition: all 0.2s ease-in-out; }
        .option-btn:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
        }
        .correct-btn { 
            background-color: #10b981 !important; 
            color: white !important; 
            border-color: #10b981 !important; 
        }
        .incorrect-btn { 
            background-color: #ef4444 !important; 
            color: white !important; 
            border-color: #ef4444 !important; 
        }
        .explanation-box { animation: fadeIn 0.5s; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(-10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        #drop-zone {
            border: 2px dashed #9ca3af;
            border-radius: 0.5rem;
            padding: 3rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
            background-color: #f9fafb;
            cursor: pointer;
        }
        #drop-zone.dragover {
            background-color: #e0f2fe;
            border-color: #3b82f6;
        }
        #file-input { display: none; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- ヘッダー -->
        <div class="bg-blue-800 text-white p-6">
            <h1 class="text-2xl font-bold text-center">日経テスト 予想問題集</h1>
            <p id="header-subtitle" class="text-center text-blue-200 mt-2 text-sm">問題データセットアップ</p>
        </div>

        <!-- セットアップ画面 -->
        <div id="setup-container" class="p-6 md:p-10">
            <h2 class="text-lg font-bold mb-4 text-gray-800 text-center">問題ファイル（.docx）を読み込む</h2>
            <p class="text-sm text-gray-600 mb-6 text-center">
                お手元の「日経テスト問題集.docx」をタップして選択してください。
            </p>
            
            <div id="drop-zone" class="mb-4 shadow-sm hover:shadow-md">
                <svg class="mx-auto h-12 w-12 text-blue-500 mb-3" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <p class="text-base text-gray-700 font-bold mb-1">ここをタップしてファイルを選択</p>
                <p class="text-xs text-gray-500">※前回途中でやめた場合は、続きから自動で再開します</p>
                <input type="file" id="file-input" accept=".docx" />
            </div>
            
            <div class="loader mt-4" id="loader"></div>
            <p id="status-msg" class="text-center text-sm font-bold mt-3 text-blue-600 hidden">問題を解析中... 少しお待ちください</p>
            <p id="error-msg" class="text-red-500 text-center text-sm mt-2 hidden"></p>
        </div>

        <!-- クイズ画面 -->
        <div id="quiz-container" class="hidden p-5 md:p-8">
            
            <!-- 進捗状況と【プルダウン機能】 -->
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-6 gap-4">
                <span id="question-number" class="text-xl font-bold text-blue-800"></span>
                
                <!-- 問題ジャンプ用プルダウン -->
                <div class="flex items-center gap-2 bg-blue-50 py-1.5 px-3 rounded-lg border border-blue-200 shadow-sm w-full sm:w-auto">
                    <label for="jump-select" class="text-sm font-bold text-blue-700 whitespace-nowrap">問題移動:</label>
                    <select id="jump-select" class="bg-transparent text-base font-bold text-gray-800 w-full focus:outline-none cursor-pointer">
                        <!-- JSで動的に追加されます -->
                    </select>
                </div>
            </div>

            <div class="flex justify-between items-center mb-2">
                <span class="text-xs text-gray-500 font-bold">進捗状況</span>
                <span id="score-display" class="text-sm font-bold text-gray-600"></span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3 mb-8 shadow-inner">
                <div id="progress-bar" class="bg-blue-600 h-3 rounded-full" style="width: 0%; transition: width 0.4s ease;"></div>
            </div>

            <!-- 問題文 -->
            <div class="mb-8 bg-white p-4 rounded-lg border border-gray-100 shadow-sm">
                <p id="question-text" class="text-lg font-medium leading-relaxed text-gray-800"></p>
            </div>

            <!-- 選択肢 -->
            <div id="options-container" class="space-y-3 mb-8"></div>

            <!-- 解説 -->
            <div id="explanation-container" class="hidden explanation-box bg-blue-50 border-l-4 border-blue-500 p-5 rounded-r-lg mb-8 shadow-sm">
                <h3 id="result-title" class="font-bold text-xl mb-3"></h3>
                <p class="text-sm font-bold text-blue-800 mb-3 bg-white inline-block px-3 py-1 rounded-full border border-blue-200 shadow-sm">KEYWORD: <span id="keyword-text" class="text-gray-800"></span></p>
                <div id="explanation-text" class="text-sm leading-relaxed text-gray-700 space-y-2"></div>
            </div>

            <button id="next-btn" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl transition duration-200 shadow-lg text-lg">
                次の問題へ
            </button>
        </div>

        <!-- リザルト画面 -->
        <div id="result-container" class="hidden p-6 md:p-10 text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">全問終了！お疲れ様でした。</h2>
            <div class="bg-gray-50 rounded-xl p-8 mb-8 border border-gray-200 shadow-sm">
                <p class="text-gray-600 mb-2 font-bold">あなたの正解数</p>
                <p class="text-4xl text-gray-800 mb-2"><span id="final-score" class="font-bold text-6xl text-blue-600"></span> / <span id="total-questions"></span> 問</p>
            </div>
            <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-full transition duration-200 shadow-lg w-full md:w-auto text-lg">
                もう一度最初から挑戦する
            </button>
        </div>
    </div>

    <script>
        let questionsData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false;

        const setupContainer = document.getElementById('setup-container');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('status-msg');
        const errorMsg = document.getElementById('error-msg');
        const headerSubtitle = document.getElementById('header-subtitle');

        const questionNumberEl = document.getElementById('question-number');
        const scoreDisplayEl = document.getElementById('score-display');
        const progressBarEl = document.getElementById('progress-bar');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationContainer = document.getElementById('explanation-container');
        const resultTitleEl = document.getElementById('result-title');
        const keywordTextEl = document.getElementById('keyword-text');
        const explanationTextEl = document.getElementById('explanation-text');
        const nextBtn = document.getElementById('next-btn');
        const jumpSelect = document.getElementById('jump-select');

        // ドラッグ＆ドロップ・ファイル選択イベント
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            errorMsg.classList.add('hidden');
            if (!file.name.endsWith('.docx')) {
                showError('Wordファイル（.docx）を選択してください。');
                return;
            }
            dropZone.style.pointerEvents = 'none';
            dropZone.style.opacity = '0.5';
            loader.style.display = 'block';
            statusMsg.classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = function(event) {
                const arrayBuffer = event.target.result;
                mammoth.extractRawText({arrayBuffer: arrayBuffer})
                    .then(function(result) {
                        processText(result.value);
                    })
                    .catch(function(err) {
                        console.error(err);
                        showError('ファイルの解析に失敗しました。');
                        resetLoader();
                    });
            };
            reader.readAsArrayBuffer(file);
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.remove('hidden');
        }

        function resetLoader() {
            dropZone.style.pointerEvents = 'auto';
            dropZone.style.opacity = '1';
            loader.style.display = 'none';
            statusMsg.classList.add('hidden');
        }

        function processText(text) {
            questionsData = parseTextToQuestions(text);
            
            if (questionsData.length === 0) {
                showError('問題を検出できませんでした。「【第〇〇問】」で始まっているか確認してください。');
                resetLoader();
                return;
            }

            // プルダウンの選択肢を生成
            jumpSelect.innerHTML = '';
            questionsData.forEach((q, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `第 ${index + 1} 問 からスタート`;
                jumpSelect.appendChild(opt);
            });

            setupContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            headerSubtitle.textContent = `全 ${questionsData.length} 問`;
            
            // ローカルストレージから前回開いていた問題番号を取得
            const savedIndex = localStorage.getItem('nikkei_quiz_last_index');
            if (savedIndex !== null && parseInt(savedIndex, 10) < questionsData.length) {
                currentQuestionIndex = parseInt(savedIndex, 10);
            } else {
                currentQuestionIndex = 0;
            }
            
            loadQuestion();
        }

        function parseTextToQuestions(text) {
            const questions = [];
            const blocks = text.split(/【第\d+(?:問|问)】/).slice(1);
            
            blocks.forEach((block, index) => {
                const lines = block.trim().split('\n').map(l => l.trim()).filter(l => l);
                let questionText = [], options = [], answerText = "", keyword = "", explanationText = [];
                let mode = 'question'; 
                
                lines.forEach(line => {
                    if (line.startsWith('【解答・解説】')) { mode = 'answer'; return; }
                    
                    if (mode === 'question') {
                        if (line.startsWith('●')) options.push(line.replace(/^●\s*/, ''));
                        else questionText.push(line);
                    } else if (mode === 'answer') {
                        if (line.startsWith('正解：')) {
                            const match = line.match(/●[（(](.*?)[)）]/);
                            if (match) answerText = match[1];
                            else answerText = line.replace('正解：', '').replace(/●/g, '').trim();
                        } else if (line.startsWith('KEYWORD：')) {
                            keyword = line.replace('KEYWORD：', '');
                        } else {
                            explanationText.push(line);
                        }
                    }
                });
                
                let correctIndex = options.findIndex(opt => opt.includes(answerText) || answerText.includes(opt));
                if (correctIndex === -1) correctIndex = 0; 
                
                if(options.length > 0) {
                    questions.push({
                        id: index + 1,
                        question: questionText.join('<br>'),
                        options: options,
                        correctIndex: correctIndex,
                        keyword: keyword,
                        explanation: explanationText.join('<br><br>') 
                    });
                }
            });
            return questions;
        }

        // ジャンプ機能（プルダウン変更時の処理）
        jumpSelect.addEventListener('change', (e) => {
            currentQuestionIndex = parseInt(e.target.value, 10);
            loadQuestion();
        });

        function loadQuestion() {
            hasAnswered = false;
            const q = questionsData[currentQuestionIndex];
            
            // 現在の問題番号をスマホのブラウザに保存（自動セーブ）
            localStorage.setItem('nikkei_quiz_last_index', currentQuestionIndex);
            
            questionNumberEl.textContent = `第 ${currentQuestionIndex + 1} 問`;
            jumpSelect.value = currentQuestionIndex; // プルダウンの表示を合わせる
            
            progressBarEl.style.width = `${((currentQuestionIndex) / questionsData.length) * 100}%`;
            scoreDisplayEl.textContent = `現在の正解数: ${score}`;
            
            questionTextEl.innerHTML = q.question;
            optionsContainer.innerHTML = '';
            explanationContainer.classList.add('hidden');
            nextBtn.classList.add('hidden');

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left bg-white border border-gray-300 hover:border-blue-500 hover:bg-blue-50 text-gray-800 font-bold py-4 px-4 rounded-xl text-base shadow-sm leading-relaxed';
                btn.textContent = opt;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            if (hasAnswered) return;
            hasAnswered = true;

            const q = questionsData[currentQuestionIndex];
            const buttons = optionsContainer.querySelectorAll('button');

            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === q.correctIndex) {
                selectedBtn.classList.add('correct-btn');
                resultTitleEl.textContent = '⭕ 正解！';
                resultTitleEl.className = 'font-bold text-xl mb-2 text-green-600';
                score++;
                scoreDisplayEl.textContent = `現在の正解数: ${score}`;
            } else {
                selectedBtn.classList.add('incorrect-btn');
                if(buttons[q.correctIndex]) buttons[q.correctIndex].classList.add('correct-btn'); 
                resultTitleEl.textContent = '❌ 不正解...';
                resultTitleEl.className = 'font-bold text-xl mb-2 text-red-600';
            }

            keywordTextEl.textContent = q.keyword;
            explanationTextEl.innerHTML = q.explanation;
            explanationContainer.classList.remove('hidden');

            if (currentQuestionIndex < questionsData.length - 1) {
                nextBtn.textContent = '次の問題へ';
            } else {
                nextBtn.textContent = '結果を見る';
            }
            nextBtn.classList.remove('hidden');
        }

        nextBtn.onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questionsData.length) {
                loadQuestion();
                window.scrollTo(0, 0);
            } else {
                showResult();
            }
        };

        function showResult() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            // 全問終わったらセーブデータをリセット
            localStorage.removeItem('nikkei_quiz_last_index');
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('total-questions').textContent = questionsData.length;
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
