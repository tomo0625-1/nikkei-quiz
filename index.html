<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日経テスト 予想問題集</title>
    <!-- スタイリング用のTailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Wordファイル(.docx)をブラウザ上で解析するためのライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; 
            background-color: #f3f4f6; 
            color: #333; 
        }
        .option-btn { transition: all 0.2s ease-in-out; }
        .option-btn:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
        }
        .correct-btn { 
            background-color: #10b981 !important; 
            color: white !important; 
            border-color: #10b981 !important; 
        }
        .incorrect-btn { 
            background-color: #ef4444 !important; 
            color: white !important; 
            border-color: #ef4444 !important; 
        }
        .explanation-box { animation: fadeIn 0.5s; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(-10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        /* ドロップエリアのスタイル */
        #drop-zone {
            border: 2px dashed #9ca3af;
            border-radius: 0.5rem;
            padding: 3rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
            background-color: #f9fafb;
            cursor: pointer;
        }
        #drop-zone.dragover {
            background-color: #e0f2fe;
            border-color: #3b82f6;
        }
        #file-input {
            display: none;
        }
        /* ローディングスピナー */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- ヘッダー -->
        <div class="bg-blue-800 text-white p-6">
            <h1 class="text-2xl font-bold text-center">日経テスト 予想問題集</h1>
            <p id="header-subtitle" class="text-center text-blue-200 mt-2 text-sm">問題データセットアップ</p>
        </div>

        <!-- セットアップ画面（Wordファイルドロップエリア） -->
        <div id="setup-container" class="p-6 md:p-10">
            <h2 class="text-lg font-bold mb-4 text-gray-800 text-center">問題ファイル（.docx）を読み込む</h2>
            <p class="text-sm text-gray-600 mb-6 text-center">
                お手元の「日経テスト問題集.docx」ファイルを下の枠内にドラッグ＆ドロップするか、<br>クリックしてファイルを選択してください。
            </p>
            
            <div id="drop-zone" class="mb-4">
                <svg class="mx-auto h-12 w-12 text-gray-400 mb-3" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <p class="text-sm text-gray-600 font-medium">ここにWordファイル (.docx) をドロップ</p>
                <p class="text-xs text-gray-500 mt-1">またはクリックしてファイルを選択</p>
                <input type="file" id="file-input" accept=".docx" />
            </div>
            
            <div class="loader mt-4" id="loader"></div>
            <p id="status-msg" class="text-center text-sm font-medium mt-2 text-gray-600 hidden">ファイルを解析中...</p>
            <p id="error-msg" class="text-red-500 text-center text-sm mt-2 hidden"></p>
        </div>

        <!-- クイズ画面 (初期状態は非表示) -->
        <div id="quiz-container" class="hidden p-6 md:p-8">
            <!-- 進捗状況 -->
            <div class="flex justify-between items-center mb-6">
                <span id="question-number" class="text-lg font-bold text-blue-800"></span>
                <span id="score-display" class="text-sm text-gray-500"></span>
            </div>

            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%; transition: width 0.3s;"></div>
            </div>

            <!-- 問題文 -->
            <div class="mb-8">
                <p id="question-text" class="text-lg font-medium leading-relaxed"></p>
            </div>

            <!-- 選択肢 -->
            <div id="options-container" class="space-y-3 mb-8"></div>

            <!-- 解説 (初期状態は非表示) -->
            <div id="explanation-container" class="hidden explanation-box bg-blue-50 border-l-4 border-blue-500 p-5 rounded-r-lg mb-8">
                <h3 id="result-title" class="font-bold text-lg mb-2"></h3>
                <p class="text-sm font-semibold text-blue-800 mb-2">KEYWORD: <span id="keyword-text" class="text-gray-800 font-normal"></span></p>
                <div id="explanation-text" class="text-sm leading-relaxed text-gray-700 space-y-2"></div>
            </div>

            <button id="next-btn" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                次の問題へ
            </button>
        </div>

        <!-- リザルト画面 (初期状態は非表示) -->
        <div id="result-container" class="hidden p-6 md:p-10 text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">全問終了！お疲れ様でした。</h2>
            <div class="bg-gray-50 rounded-xl p-8 mb-8 border border-gray-200">
                <p class="text-gray-600 mb-2">あなたの正答率</p>
                <p id="final-percentage" class="text-5xl font-bold text-blue-600 mb-4"></p>
                <p class="text-lg text-gray-700"><span id="total-questions"></span>問中 <span id="final-score" class="font-bold"></span> 問正解</p>
            </div>
            <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full transition duration-200 shadow-md">
                タイトルへ戻る（別のファイルを読み込む）
            </button>
        </div>
    </div>

    <script>
        let questionsData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false;

        // DOM要素の取得
        const setupContainer = document.getElementById('setup-container');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('status-msg');
        const errorMsg = document.getElementById('error-msg');
        const headerSubtitle = document.getElementById('header-subtitle');

        const questionNumberEl = document.getElementById('question-number');
        const scoreDisplayEl = document.getElementById('score-display');
        const progressBarEl = document.getElementById('progress-bar');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationContainer = document.getElementById('explanation-container');
        const resultTitleEl = document.getElementById('result-title');
        const keywordTextEl = document.getElementById('keyword-text');
        const explanationTextEl = document.getElementById('explanation-text');
        const nextBtn = document.getElementById('next-btn');

        // ドラッグ＆ドロップのイベント設定
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                handleFile(file);
            }
        });

        // クリックでファイル選択
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                handleFile(file);
            }
        });

        // ファイルを処理する関数
        function handleFile(file) {
            errorMsg.classList.add('hidden');
            
            // 拡張子チェック
            if (!file.name.endsWith('.docx')) {
                showError('Wordファイル（.docx）を選択してください。');
                return;
            }

            // ロード中表示
            dropZone.style.pointerEvents = 'none';
            dropZone.style.opacity = '0.5';
            loader.style.display = 'block';
            statusMsg.textContent = 'Wordファイルを解析中...';
            statusMsg.classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = function(event) {
                const arrayBuffer = event.target.result;
                
                // Mammoth.jsを使用してWord(.docx)をブラウザ上でテキストに変換
                mammoth.extractRawText({arrayBuffer: arrayBuffer})
                    .then(function(result) {
                        const text = result.value;
                        processText(text);
                    })
                    .catch(function(err) {
                        console.error(err);
                        showError('ファイルの解析に失敗しました。ファイルが破損していないか確認してください。');
                        resetLoader();
                    });
            };
            reader.readAsArrayBuffer(file);
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.remove('hidden');
        }

        function resetLoader() {
            dropZone.style.pointerEvents = 'auto';
            dropZone.style.opacity = '1';
            loader.style.display = 'none';
            statusMsg.classList.add('hidden');
        }

        // 抽出したテキストをパースする
        function processText(text) {
            questionsData = parseTextToQuestions(text);
            
            if (questionsData.length === 0) {
                showError('問題を検出できませんでした。「【第〇〇問】」という形式で始まっているか確認してください。');
                resetLoader();
                return;
            }

            // 画面の切り替え
            setupContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            headerSubtitle.textContent = `全 ${questionsData.length} 問`;
            
            loadQuestion();
        }

        // テキストを解析して問題配列に変換する関数
        function parseTextToQuestions(text) {
            const questions = [];
            // 「【第〇〇問】」または「【第〇〇问】」を区切りとしてブロックに分割
            const blocks = text.split(/【第\d+(?:問|问)】/).slice(1);
            
            blocks.forEach((block, index) => {
                const lines = block.trim().split('\n').map(l => l.trim()).filter(l => l);
                let questionText = [];
                let options = [];
                let answerText = "";
                let keyword = "";
                let explanationText = [];
                
                let mode = 'question'; 
                
                lines.forEach(line => {
                    if (line.startsWith('【解答・解説】')) {
                        mode = 'answer';
                        return;
                    }
                    
                    if (mode === 'question') {
                        // 選択肢の抽出 (● で始まる行)
                        if (line.startsWith('●')) {
                            options.push(line.replace(/^●\s*/, ''));
                        } else {
                            questionText.push(line);
                        }
                    } else if (mode === 'answer') {
                        if (line.startsWith('正解：')) {
                            // 括弧内のテキストを抽出するか、なければそのまま使用
                            const match = line.match(/●[（(](.*?)[)）]/);
                            if (match) {
                                answerText = match[1];
                            } else {
                                answerText = line.replace('正解：', '').replace(/●/g, '').trim();
                            }
                        } else if (line.startsWith('KEYWORD：')) {
                            keyword = line.replace('KEYWORD：', '');
                        } else {
                            explanationText.push(line);
                        }
                    }
                });
                
                // 正解のインデックスを探す (部分一致などで判定)
                let correctIndex = options.findIndex(opt => opt.includes(answerText) || answerText.includes(opt));
                if (correctIndex === -1) correctIndex = 0; // 見つからない場合のフォールバック
                
                if(options.length > 0) {
                    questions.push({
                        id: index + 1,
                        question: questionText.join('<br>'),
                        options: options,
                        correctIndex: correctIndex,
                        keyword: keyword,
                        explanation: explanationText.join('<br><br>') // 段落を少し開ける
                    });
                }
            });
            return questions;
        }

        // 問題の読み込みと表示
        function loadQuestion() {
            hasAnswered = false;
            const q = questionsData[currentQuestionIndex];
            
            questionNumberEl.textContent = `第 ${currentQuestionIndex + 1} 問 / ${questionsData.length}`;
            progressBarEl.style.width = `${((currentQuestionIndex) / questionsData.length) * 100}%`;
            scoreDisplayEl.textContent = `正解: ${score}`;
            
            questionTextEl.innerHTML = q.question;
            optionsContainer.innerHTML = '';
            explanationContainer.classList.add('hidden');
            nextBtn.classList.add('hidden');

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left bg-white border border-gray-300 hover:border-blue-500 hover:bg-blue-50 text-gray-800 font-medium py-3 px-4 rounded-lg';
                btn.textContent = opt;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // 選択肢を選んだ時の処理
        function selectOption(selectedIndex, selectedBtn) {
            if (hasAnswered) return;
            hasAnswered = true;

            const q = questionsData[currentQuestionIndex];
            const buttons = optionsContainer.querySelectorAll('button');

            // 選択後はボタンを無効化
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === q.correctIndex) {
                selectedBtn.classList.add('correct-btn');
                resultTitleEl.textContent = '⭕ 正解！';
                resultTitleEl.className = 'font-bold text-lg mb-2 text-green-600';
                score++;
                scoreDisplayEl.textContent = `正解: ${score}`;
            } else {
                selectedBtn.classList.add('incorrect-btn');
                if(buttons[q.correctIndex]) {
                    buttons[q.correctIndex].classList.add('correct-btn'); // 正解のボタンを緑色に
                }
                resultTitleEl.textContent = '❌ 不正解...';
                resultTitleEl.className = 'font-bold text-lg mb-2 text-red-600';
            }

            keywordTextEl.textContent = q.keyword;
            explanationTextEl.innerHTML = q.explanation;
            explanationContainer.classList.remove('hidden');

            if (currentQuestionIndex < questionsData.length - 1) {
                nextBtn.textContent = '次の問題へ';
            } else {
                nextBtn.textContent = '結果を見る';
            }
            nextBtn.classList.remove('hidden');
        }

        // 次へボタンの処理
        nextBtn.onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questionsData.length) {
                loadQuestion();
                window.scrollTo(0, 0);
            } else {
                showResult();
            }
        };

        // 結果画面の表示
        function showResult() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            
            const percentage = Math.round((score / questionsData.length) * 100);
            document.getElementById('final-percentage').textContent = `${percentage}%`;
            document.getElementById('final-score').textContent = score;
            document.getElementById('total-questions').textContent = questionsData.length;
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
